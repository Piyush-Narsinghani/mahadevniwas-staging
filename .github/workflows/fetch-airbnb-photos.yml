name: Save Airbnb photos into the site
on:
  push:
    paths: ['.github/airbnb-photos.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Download and convert photos
        run: |
          pip install -q pillow pillow-avif-plugin requests
          python - <<'PY'
          import io, os, requests
          from PIL import Image, ImageOps
          try:
              import pillow_avif  # noqa
          except Exception: pass
          os.makedirs('images/airbnb', exist_ok=True)
          log=[]
          H={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36',
             'Referer':'https://www.airbnb.co.in/','Accept':'image/jpeg,image/png,image/*;q=0.8'}
          for line in open('.github/airbnb-photos.txt'):
              parts=line.split()
              if len(parts)!=2 or line.startswith('#'): continue
              name,url=parts
              done=False
              for u in (url+'?im_w=1600', url+'?im_w=1200', url):
                  try:
                      r=requests.get(u,headers=H,timeout=30)
                      log.append(f'{name} {r.status_code} {r.headers.get("content-type")} {len(r.content)} {u}')
                      if r.status_code!=200: continue
                      im=ImageOps.exif_transpose(Image.open(io.BytesIO(r.content))).convert('RGB')
                      for w,q in ((1600,76),(800,74)):
                          c=im.copy(); c.thumbnail((w,w)); c.save(f'images/airbnb/{name}-{w}.webp','WEBP',quality=q,method=6)
                      done=True; break
                  except Exception as e:
                      log.append(f'{name} ERROR {e!r} {u}')
              if not done: log.append(f'FAILED {name}')
          open('images/airbnb/fetch-log.txt','w').write('\n'.join(log)+'\n')
          print('\n'.join(log))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/airbnb
          git diff --cached --quiet || git commit -m "Save Airbnb photos into the site"
          git push
